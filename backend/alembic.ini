# Alembic Configuration File
# Balaji Heart Center - Database Migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version path separator
# version_path_separator = os
# Use os.pathsep.
# version_path_separator = :
# Use : (colon)
# version_path_separator = ;
# Use ; (semicolon)

# Timezone for timestamp in migration file
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to invoke the compare_type function on each column
# compare_type = false

# Set to 'true' to invoke the compare_server_default function on each column
# compare_server_default = false

# Prepend the version directory name to the file name
# prepend_sys_path = .

# Database URL - will be overridden by env.py using settings
# sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Post write hooks run after successful revision or upgrade
# Uncomment to format with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
